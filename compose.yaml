services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SCOOBY_DATA: /data
      SCOOBY_BROWSER: ${SCOOBY_BROWSER:-}
      SCOOBY_WEB_ORIGIN: ${SCOOBY_WEB_ORIGIN:-http://localhost:3000}
      SCOOBY_MODEL_CALL_BUDGET: "0"
      SCOOBY_CASE_SYNC_ENABLED: ${SCOOBY_CASE_SYNC_ENABLED:-false}
      SCOOBY_CASE_SYNC_LIMIT: ${SCOOBY_CASE_SYNC_LIMIT:-10}
      SCOOBY_DISCOVERY_DB: ${SCOOBY_DISCOVERY_DB:-}
      SCOOBY_DISCOVERY_ROOT: ${SCOOBY_DISCOVERY_ROOT:-}
    volumes:
      - scooby-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "huey.bin.huey_consumer", "worker.huey", "-w", "1"]
    environment:
      SCOOBY_DATA: /data
      SCOOBY_BROWSER: ${SCOOBY_BROWSER:-}
      SCOOBY_MODEL_CALL_BUDGET: "0"
      SCOOBY_CASE_SYNC_ENABLED: ${SCOOBY_CASE_SYNC_ENABLED:-false}
      SCOOBY_CASE_SYNC_LIMIT: ${SCOOBY_CASE_SYNC_LIMIT:-10}
      SCOOBY_DISCOVERY_DB: ${SCOOBY_DISCOVERY_DB:-}
      SCOOBY_DISCOVERY_ROOT: ${SCOOBY_DISCOVERY_ROOT:-}
    volumes:
      - scooby-data:/data
    healthcheck:
      test: ["CMD", "python", "/app/ops/worker_health.py"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
volumes:
  scooby-data:
