# Render blueprint: backend API only (step 1 of docs/render-deploy.md). Publishing stays off.
# One instance only: device codes live in process memory and SQLite needs a single writer.
services:
  - type: web
    name: scooby-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # paid plan: persistent disks and the Render Shell need it
    region: singapore
    branch: main
    numInstances: 1
    healthCheckPath: /health
    disk:
      name: scooby-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: SCOOBY_DATA
        value: /data
      - key: SCOOBY_PUBLIC_GATE
        value: "true"
      - key: SCOOBY_OPERATOR_TOKEN
        generateValue: true
      - key: SCOOBY_MODEL_CALL_BUDGET
        value: "0"
      - key: SCOOBY_PUBLISH_ENABLED
        value: "false"
      - key: SCOOBY_DEMO_AUTOPUBLISH
        value: "false"
      - key: SCOOBY_CLAIM_HASH_ALG
        value: keccak256
      - key: SCOOBY_CHAIN_ID
        value: "11155111"
      - key: SCOOBY_REPORT_REGISTRY
        value: "0x805d681383f580403b979bf1d017cff045dc7ebd"
      # World ID (step 3): set in the dashboard after portal registration.
      - key: WORLD_ISSUER
        value: https://auth.world.org
      - key: WORLD_CLIENT_ID
        sync: false
      - key: WORLD_CLIENT_KEY_ID
        value: scooby-2026-11
      - key: WORLD_CLIENT_KEY_PATH
        value: /etc/secrets/world_client_key.pem   # upload as a Render Secret File
      - key: WORLD_ACCEPTED_ACR
        value: https://world.org/oidc/acr/orb,https://world.org/oidc/acr/orb-face
      - key: WORLD_ASSERTION_AUD
        value: endpoint
      # Public library lists only World-confirmed approved reports; SMEs review via /web/v1/admin.
      - key: SCOOBY_REPORT_RELEASE
        value: approved
      - key: SCOOBY_ADMIN_AUDIENCE
        value: https://scoobydao-backend.onrender.com
      # Each report is read through its own World confirmation (review desk Read button).
      - key: SCOOBY_REVIEW_PER_REPORT
        value: "true"
      # Output of `python -m publication.cli export-reviewer --name <label>`; set in the dashboard.
      - key: SCOOBY_REVIEWERS
        sync: false
      # No persistent disk on the free plan: run the worker in this container and reapply the verified report seed
      # at every start (DEPLOYMENT.md, "seed at start"). Upload the archive's base64 as Secret File report-seed.zip.b64.
      # Display-only milestone (docs/reference-display-contract.md): no scouting, case sync, research, model,
      # render or reasoning work. SCOOBY_DISPLAY_ONLY=true returns 503 on those routes and never starts a worker,
      # whatever SCOOBY_EMBEDDED_WORKER says (so seeded reports are not rendered; the reference reader needs no render).
      - key: SCOOBY_DISPLAY_ONLY
        value: "true"
      - key: SCOOBY_SCOUT_ENABLED
        value: "false"
      - key: SCOOBY_CASE_SYNC_ENABLED
        value: "false"
      - key: SCOOBY_CASE_MODEL_MAX_CALLS
        value: "0"
      - key: SCOOBY_EMBEDDED_WORKER
        value: "true"
      - key: SCOOBY_SEED_ARCHIVE
        value: /etc/secrets/report-seed.zip.b64
      - key: SCOOBY_SEED_ARCHIVE_SHA256
        sync: false
      - key: SCOOBY_SEED_MANIFEST_SHA256
        sync: false
      - key: SCOOBY_SEED_REPORT_IDS
        sync: false
      # Six-reference display seed. The base64 ZIP (~3.5 MB) exceeds Render's 1 MB combined Secret File limit, so use
      # either SCOOBY_REFERENCE_SEED_ARCHIVE (a path on a persistent disk / one-time restore) or SCOOBY_REFERENCE_SEED_URL
      # (+ optional SCOOBY_REFERENCE_SEED_AUTH_HEADER) for one HTTPS GET at each start. Set exactly one of them.
      - key: SCOOBY_REFERENCE_SEED_SHA256
        value: c9fcbf2a32b7c58142389075511989357431b4d457ae89997ebae2261697b8a0
      - key: SCOOBY_REFERENCE_SEED_ARCHIVE
        sync: false
      - key: SCOOBY_REFERENCE_SEED_URL
        sync: false
      - key: SCOOBY_REFERENCE_SEED_AUTH_HEADER
        sync: false
      # Set when the frontend is deployed (step 4); exact origin, no trailing slash.
      - key: SCOOBY_WEB_ORIGIN
        sync: false
