name: Python checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q tests
      - run: python tests/smoke_worker.py
      - run: python -m unittest discover -s vendor/reader -p test_export.py -v
      - run: python -m unittest discover -s modules/discovery -v
        env:
          SCOOBY_CANDIDATE_SCHEMA: ${{ github.workspace }}/schemas/candidate.schema.json
      - run: python modules/investigation/test_boundaries.py
