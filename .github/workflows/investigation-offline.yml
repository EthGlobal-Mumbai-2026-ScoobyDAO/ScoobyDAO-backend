name: Offline investigation checks
on:
  push:
  pull_request:
jobs:
  offline-investigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest 'jsonschema>=4.26,<5'
      - run: python -m pytest -q tests/test_legacy_source_port.py tests/test_mechanism_readiness.py tests/test_pinned_rpc_readiness.py tests/test_reasoning_v2_contract.py
